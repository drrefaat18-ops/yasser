<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" font-family="Segoe UI, Arial, sans-serif">
<rect width="860" height="260" fill="#ffffff"/>
<text x="430" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">Protecting patient data for AI training</text>
<g font-size="14" fill="#1f2d3d" text-anchor="middle">
<rect x="20" y="70" width="180" height="90" rx="8" fill="#fbeaea" stroke="#a12b2b"/><text x="110" y="104" font-weight="700">Raw records</text><text x="110" y="128">names, dates,</text><text x="110" y="146">record numbers</text>
<rect x="230" y="70" width="180" height="90" rx="8" fill="#fdf0d5" stroke="#9a6b00"/><text x="320" y="104" font-weight="700">De-identify</text><text x="320" y="128">remove identifiers</text><text x="320" y="146">(e.g. HIPAA Safe Harbor)</text>
<rect x="440" y="70" width="180" height="90" rx="8" fill="#d6e6f5" stroke="#2b5d8a"/><text x="530" y="104" font-weight="700">Privacy methods</text><text x="530" y="128">differential privacy,</text><text x="530" y="146">federated learning</text>
<rect x="650" y="70" width="190" height="90" rx="8" fill="#e3f2e1" stroke="#2f7a3a"/><text x="745" y="104" font-weight="700">Secure use</text><text x="745" y="128">access control,</text><text x="745" y="146">audit, encryption</text></g>
<g fill="#1f2d3d"><polygon points="203,109 225,115 203,121"/><polygon points="413,109 435,115 413,121"/><polygon points="623,109 645,115 623,121"/></g>
<text x="430" y="200" text-anchor="middle" font-size="15" fill="#a12b2b">Each step reduces re-identification risk. None removes it completely.</text>
<text x="430" y="224" text-anchor="middle" font-size="14" fill="#1f2d3d">De-identified is not anonymous. Pseudonymised data are still personal data under GDPR.</text>
</svg>
