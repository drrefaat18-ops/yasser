<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560"><rect width="900" height="560" fill="#FFFFFF"/><g font-family="Segoe UI, Arial, Helvetica, sans-serif" fill="#1D2A38"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6470"/></marker></defs><text x="20" y="30" font-size="15" fill="#104C4A" text-anchor="start" font-weight="bold">Three processes decide what reaches the urine</text><rect x="40" y="78" width="820" height="44" rx="6" fill="#E9F1F0" stroke="#104C4A" stroke-width="2"/><text x="450.0" y="104.9" font-size="14" text-anchor="middle">Blood  —  free drug + protein-bound drug</text><rect x="40" y="196" width="820" height="44" rx="6" fill="#FFFFFF" stroke="#5A6470" stroke-width="2"/><text x="450.0" y="222.9" font-size="14" text-anchor="middle">Tubular fluid  —  drug on its way to the urine</text><line x1="150" y1="122" x2="150" y2="196" stroke="#104C4A" stroke-width="2" marker-end="url(#a)"/><text x="150" y="152" font-size="13.5" fill="#104C4A" text-anchor="middle" font-weight="bold" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">filtration</text><text x="150" y="170" font-size="11.5" fill="#5A6470" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">passive, free drug only</text><text x="150" y="186" font-size="11.5" fill="#5A6470" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">GFR 125–130 mL·min⁻¹</text><line x1="450" y1="122" x2="450" y2="196" stroke="#104C4A" stroke-width="2" marker-end="url(#a)"/><text x="450" y="152" font-size="13.5" fill="#104C4A" text-anchor="middle" font-weight="bold" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">active secretion</text><text x="450" y="170" font-size="11.5" fill="#5A6470" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">carrier + energy, against gradient</text><text x="450" y="186" font-size="11.5" fill="#5A6470" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">acid and base carriers compete</text><line x1="750" y1="196" x2="750" y2="122" stroke="#B26B00" stroke-width="2" marker-end="url(#a)"/><text x="750" y="152" font-size="13.5" fill="#B26B00" text-anchor="middle" font-weight="bold" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">reabsorption</text><text x="750" y="170" font-size="11.5" fill="#5A6470" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">favours the unionised form</text><text x="750" y="186" font-size="11.5" fill="#5A6470" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">set by urine pH and pKa</text><line x1="860" y1="218" x2="880" y2="218" stroke="#5A6470" stroke-width="2" marker-end="url(#a)"/><text x="870" y="254" font-size="12.5" fill="#5A6470" text-anchor="middle" font-weight="bold">urine</text><text x="450" y="290" font-size="15" fill="#1D2A38" text-anchor="middle" font-weight="bold">excretion  =  filtration  +  secretion  −  reabsorption</text><text x="20" y="350" font-size="15" fill="#104C4A" text-anchor="start" font-weight="bold">What the clearance ratio tells you</text><line x1="120" y1="410" x2="800" y2="410" stroke="#1D2A38" stroke-width="2.5"/><text x="460.0" y="538" font-size="14" fill="#1D2A38" text-anchor="middle">Cl(drug) / Cl(inulin or creatinine)</text><line x1="120.0" y1="400" x2="120.0" y2="420" stroke="#B26B00" stroke-width="2.5"/><text x="120.0" y="390" font-size="14" fill="#B26B00" text-anchor="middle" font-weight="bold">0</text><text x="120.0" y="442" font-size="11.5" fill="#5A6470" text-anchor="middle">completely</text><text x="120.0" y="458" font-size="11.5" fill="#5A6470" text-anchor="middle">reabsorbed</text><text x="120.0" y="474" font-size="11.5" fill="#5A6470" text-anchor="middle">(glucose, below</text><text x="120.0" y="490" font-size="11.5" fill="#5A6470" text-anchor="middle">its threshold)</text><line x1="344.4" y1="400" x2="344.4" y2="420" stroke="#B26B00" stroke-width="2.5"/><text x="344.4" y="390" font-size="14" fill="#B26B00" text-anchor="middle" font-weight="bold">&lt; 1</text><text x="344.4" y="442" font-size="11.5" fill="#5A6470" text-anchor="middle">filtered, then</text><text x="344.4" y="458" font-size="11.5" fill="#5A6470" text-anchor="middle">partially</text><text x="344.4" y="474" font-size="11.5" fill="#5A6470" text-anchor="middle">reabsorbed</text><line x1="541.6" y1="400" x2="541.6" y2="420" stroke="#104C4A" stroke-width="2.5"/><text x="541.6" y="390" font-size="14" fill="#104C4A" text-anchor="middle" font-weight="bold">= 1</text><text x="541.6" y="442" font-size="11.5" fill="#5A6470" text-anchor="middle">filtered</text><text x="541.6" y="458" font-size="11.5" fill="#5A6470" text-anchor="middle">only</text><text x="541.6" y="474" font-size="11.5" fill="#5A6470" text-anchor="middle">(inulin)</text><line x1="732.0" y1="400" x2="732.0" y2="420" stroke="#104C4A" stroke-width="2.5"/><text x="732.0" y="390" font-size="14" fill="#104C4A" text-anchor="middle" font-weight="bold">&gt; 1</text><text x="732.0" y="442" font-size="11.5" fill="#5A6470" text-anchor="middle">actively</text><text x="732.0" y="458" font-size="11.5" fill="#5A6470" text-anchor="middle">secreted</text><text x="732.0" y="474" font-size="11.5" fill="#5A6470" text-anchor="middle">(PAH)</text><text x="20" y="546" font-size="12" fill="#5A6470" text-anchor="start">A ratio of 1 means no net secretion or reabsorption — not that neither is happening.</text></g></svg>