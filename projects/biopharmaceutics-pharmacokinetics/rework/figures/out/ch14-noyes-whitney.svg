<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440"><rect width="820" height="440" fill="#FFFFFF"/><g font-family="Segoe UI, Arial, Helvetica, sans-serif" fill="#1D2A38"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6470"/></marker></defs><text x="410.0" y="32" font-size="15" fill="#104C4A" text-anchor="middle" font-weight="bold">Diffusion across the stagnant layer</text><rect x="60" y="70" width="170" height="260" fill="#D9E3E2" stroke="#104C4A" stroke-width="2"/><text x="145.0" y="192.0" font-size="14" fill="#104C4A" text-anchor="middle" font-weight="bold">Solid drug</text><text x="145.0" y="214.0" font-size="12" fill="#5A6470" text-anchor="middle">surface area A</text><rect x="230" y="70" width="200" height="260" fill="#F4EFE6"/><text x="330.0" y="92" font-size="13" fill="#B26B00" text-anchor="middle" font-weight="bold">stagnant layer</text><text x="595.0" y="92" font-size="13" fill="#1D2A38" text-anchor="middle" font-weight="bold">bulk medium, well stirred</text><line x1="230" y1="120" x2="430" y2="280" stroke="#104C4A" stroke-width="3"/><line x1="430" y1="280" x2="760" y2="280" stroke="#104C4A" stroke-width="3"/><circle cx="230.0" cy="120.0" r="5" fill="#104C4A"/><circle cx="430.0" cy="280.0" r="5" fill="#104C4A"/><text x="240" y="110" font-size="12.5" fill="#104C4A" text-anchor="start" font-weight="bold" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">Cs (saturated)</text><text x="754" y="268" font-size="12.5" fill="#104C4A" text-anchor="end" font-weight="bold" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">C (bulk)</text><line x1="255" y1="300" x2="415" y2="300" stroke="#B26B00" stroke-width="2" marker-end="url(#a)"/><text x="330.0" y="320" font-size="12" fill="#B26B00" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">diffusion, D</text><line x1="230" y1="348" x2="430" y2="348" stroke="#1D2A38" stroke-width="1.5"/><line x1="230" y1="340" x2="230" y2="356" stroke="#1D2A38" stroke-width="1.5"/><line x1="430" y1="340" x2="430" y2="356" stroke="#1D2A38" stroke-width="1.5"/><text x="330.0" y="374" font-size="12.5" fill="#1D2A38" text-anchor="middle" font-weight="bold">thickness h</text><text x="410.0" y="426" font-size="12.5" fill="#1D2A38" text-anchor="middle">Rate ∝ (D·A / h)(Cs − C).  Sink condition: C ≪ Cs, so the gradient is set by Cs.</text></g></svg>