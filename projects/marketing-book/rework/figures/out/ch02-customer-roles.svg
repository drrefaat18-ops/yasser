<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540"><rect width="900" height="540" fill="#FFFFFF"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5E6B78"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker></defs><g font-family="Segoe UI, Arial, Helvetica, sans-serif" fill="#1E2430"><rect x="330" y="190" width="240" height="90" rx="45" fill="#1F4E79"/><text x="450.0" y="228.0" font-size="16" text-anchor="middle" fill="#FFFFFF" font-weight="bold" font-style="normal">A prescribed test</text><text x="450.0" y="248.0" font-size="16" text-anchor="middle" fill="#FFFFFF" font-weight="bold" font-style="normal">or scan</text><rect x="5" y="25" width="250" height="100" rx="8" fill="#EEF3F9" stroke="#1F4E79" stroke-width="2"/><text x="130.0" y="56.0" font-size="18" text-anchor="middle" fill="#1F4E79" font-weight="bold" font-style="normal">Decider</text><text x="130.0" y="82.0" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="normal" font-style="normal">Chooses the service:</text><text x="130.0" y="100.0" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="normal" font-style="normal">usually the doctor</text><line x1="255.0" y1="75.0" x2="330.0" y2="215.0" stroke="#5E6B78" stroke-width="2" marker-end="url(#a)"/><rect x="645" y="25" width="250" height="100" rx="8" fill="#EEF3F9" stroke="#1F4E79" stroke-width="2"/><text x="770.0" y="56.0" font-size="18" text-anchor="middle" fill="#1F4E79" font-weight="bold" font-style="normal">Payer</text><text x="770.0" y="82.0" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="normal" font-style="normal">Funds it: patient, insurer,</text><text x="770.0" y="100.0" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="normal" font-style="normal">employer or the state</text><line x1="645.0" y1="75.0" x2="570.0" y2="215.0" stroke="#5E6B78" stroke-width="2" marker-end="url(#a)"/><rect x="5" y="355" width="250" height="100" rx="8" fill="#FBEDE9" stroke="#C8553D" stroke-width="2"/><text x="130.0" y="386.0" font-size="18" text-anchor="middle" fill="#C8553D" font-weight="bold" font-style="normal">Influencer</text><text x="130.0" y="412.0" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="normal" font-style="normal">Shapes the choice: family,</text><text x="130.0" y="430.0" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="normal" font-style="normal">friend, pharmacist, website</text><line x1="255.0" y1="405.0" x2="330.0" y2="255.0" stroke="#5E6B78" stroke-width="2" marker-end="url(#a)"/><rect x="645" y="355" width="250" height="100" rx="8" fill="#FBEDE9" stroke="#C8553D" stroke-width="2"/><text x="770.0" y="386.0" font-size="18" text-anchor="middle" fill="#C8553D" font-weight="bold" font-style="normal">User</text><text x="770.0" y="412.0" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="normal" font-style="normal">Receives it:</text><text x="770.0" y="430.0" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="normal" font-style="normal">the patient</text><line x1="645.0" y1="405.0" x2="570.0" y2="255.0" stroke="#5E6B78" stroke-width="2" marker-end="url(#a)"/><text x="450.0" y="520.0" font-size="14" text-anchor="middle" fill="#5E6B78" font-weight="normal" font-style="italic">In a consumer market one person usually decides, pays and uses. In health care the roles are often split.</text></g></svg>