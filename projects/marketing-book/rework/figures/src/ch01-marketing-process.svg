.9" y="200.7" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="bold" font-style="normal">Products</text><text x="625.9" y="218.7" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="normal" font-style="normal">and services</text><rect x="470.7402716741076" y="379.66814395936524" width="176" height="64" rx="6" fill="#EEF3F9" stroke="#1F4E79" stroke-width="2"/><text x="558.7" y="407.6" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="bold" font-style="normal">Value, satisfaction</text><text x="558.7" y="425.6" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="normal" font-style="normal">and quality</text><rect x="253.25972832589252" y="379.66814395936524" width="176" height="64" rx="6" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="341.3" y="407.6" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="bold" font-style="normal">Exchange and</text><text x="341.3" y="425.6" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="normal" font-style="normal">relationships</text><rect x="186.0545444853966" y="172.83185604063476" width="176" height="64" rx="6" fill="#EEF3F9" stroke="#C8553D" stroke-width="2"/><text x="274.1" y="209.7" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="bold" font-style="normal">Markets</text><text x="450.0" y="505.0" font-size="14" text-anchor="middle" fill="#5E6B78" font-weight="normal" font-style="italic">In health care, professionals often define the need; patients shape wants and demand.</text></g></svg>