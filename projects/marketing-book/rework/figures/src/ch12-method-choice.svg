<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 535" width="900" height="535"><rect width="900" height="535" fill="#FFFFFF"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5E6B78"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker></defs><g font-family="Segoe UI, Arial, Helvetica, sans-serif" fill="#1E2430"><text x="450.0" y="36.0" font-size="17" text-anchor="middle" fill="#1F4E79" font-weight="bold" font-style="normal">Choosing a method of economic evaluation</text><path d="M250,60.0 L400.0,115 L250,170.0 L100.0,115 z" fill="#EEF3F9" stroke="#1F4E79" stroke-width="2"/><text x="250.0" y="111.5" font-size="13" text-anchor="middle" fill="#1E2430" font-weight="normal" font-style="normal">Have the outcomes been</text><text x="250.0" y="128.5" font-size="13" text-anchor="middle" fill="#1E2430" font-weight="normal" font-style="normal">shown to be equivalent?</text><rect x="600" y="85" width="250" height="60" rx="6" fill="#FBEDE9" stroke="#C8553D" stroke-width="2"/><text x="725.0" y="110.9" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="bold" font-style="normal">CMA</text><text x="725.0" y="128.9" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="normal" font-style="normal">compare costs only</text><line x1="400.0" y1="115.0" x2="598.0" y2="115.0" stroke="#5E6B78" stroke-width="2" marker-end="url(#a)"/><text x="500.0" y="106.0" font-size="13" text-anchor="middle" fill="#5E6B78" font-weight="bold" font-style="normal">Yes</text><path d="M250,225.0 L400.0,280 L250,335.0 L100.0,280 z" fill="#EEF3F9" stroke="#1F4E79" stroke-width="2"/><text x="250.0" y="276.5" font-size="13" text-anchor="middle" fill="#1E2430" font-weight="normal" font-style="normal">In what units are</text><text x="250.0" y="293.5" font-size="13" text-anchor="middle" fill="#1E2430" font-weight="normal" font-style="normal">the outcomes measured?</text><line x1="250.0" y1="170.0" x2="250.0" y2="224.0" stroke="#5E6B78" stroke-width="2" marker-end="url(#a)"/><text x="262.0" y="202.0" font-size="13" text-anchor="start" fill="#5E6B78" font-weight="bold" font-style="normal">No</text><rect x="5" y="400" width="230" height="80" rx="6" fill="#FBEDE9" stroke="#C8553D" stroke-width="2"/><text x="120.0" y="426.9" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="bold" font-style="normal">CEA</text><text x="120.0" y="444.9" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="normal" font-style="normal">cost per case detected,</text><text x="120.0" y="462.9" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="normal" font-style="normal">per life saved</text><path d="M250,335 L250,365 L120,365 L120,396" fill="none" stroke="#5E6B78" stroke-width="2" marker-end="url(#a)"/><text x="128.0" y="385.0" font-size="13" text-anchor="start" fill="#5E6B78" font-weight="bold" font-style="normal">Natural units</text><rect x="335" y="400" width="230" height="80" rx="6" fill="#FBEDE9" stroke="#C8553D" stroke-width="2"/><text x="450.0" y="435.9" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="bold" font-style="normal">CUA</text><text x="450.0" y="453.9" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="normal" font-style="normal">cost per QALY</text><path d="M250,335 L250,365 L450,365 L450,396" fill="none" stroke="#5E6B78" stroke-width="2" marker-end="url(#a)"/><text x="458.0" y="385.0" font-size="13" text-anchor="start" fill="#5E6B78" font-weight="bold" font-style="normal">QALYs</text><rect x="665" y="400" width="230" height="80" rx="6" fill="#FBEDE9" stroke="#C8553D" stroke-width="2"/><text x="780.0" y="426.9" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="bold" font-style="normal">CBA</text><text x="780.0" y="444.9" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="normal" font-style="normal">benefit–cost ratio,</text><text x="780.0" y="462.9" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="normal" font-style="normal">net benefit</text><path d="M250,335 L250,365 L780,365 L780,396" fill="none" stroke="#5E6B78" stroke-width="2" marker-end="url(#a)"/><text x="788.0" y="385.0" font-size="13" text-anchor="start" fill="#5E6B78" font-weight="bold" font-style="normal">Money</text><text x="450.0" y="515.0" font-size="13" text-anchor="middle" fill="#5E6B78" font-weight="normal" font-style="italic">Equivalence must be shown by evidence, not assumed; otherwise compare costs and outcomes together.</text></g></svg>