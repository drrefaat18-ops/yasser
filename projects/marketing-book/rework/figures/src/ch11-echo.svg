<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420"><rect width="900" height="420" fill="#FFFFFF"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5E6B78"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker></defs><g font-family="Segoe UI, Arial, Helvetica, sans-serif" fill="#1E2430"><rect x="30" y="70" width="260" height="300" rx="10" fill="#EEF3F9" stroke="#1F4E79" stroke-width="2"/><rect x="30" y="70" width="260" height="56" rx="10" fill="#1F4E79"/><rect x="30" y="110" width="260" height="16" fill="#1F4E79"/><text x="160.0" y="106.0" font-size="17" text-anchor="middle" fill="#FFFFFF" font-weight="bold" font-style="normal">Economic outcomes</text><text x="160.0" y="162.0" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="normal" font-style="normal">Fewer admissions and</text><text x="160.0" y="180.0" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="normal" font-style="normal">other resources saved</text><text x="160.0" y="238.0" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="normal" font-style="normal">Savings from</text><text x="160.0" y="256.0" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="normal" font-style="normal">treatment</text><text x="160.0" y="314.0" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="normal" font-style="normal">Production gained on</text><text x="160.0" y="332.0" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="normal" font-style="normal">returning to work</text><line x1="70" y1="206" x2="250" y2="206" stroke="#1F4E79" stroke-opacity="0.35"/><line x1="70" y1="282" x2="250" y2="282" stroke="#1F4E79" stroke-opacity="0.35"/><rect x="320" y="70" width="260" height="300" rx="10" fill="#E7F3EC" stroke="#2E7D5B" stroke-width="2"/><rect x="320" y="70" width="260" height="56" rx="10" fill="#2E7D5B"/><rect x="320" y="110" width="260" height="16" fill="#2E7D5B"/><text x="450.0" y="106.0" font-size="17" text-anchor="middle" fill="#FFFFFF" font-weight="bold" font-style="normal">Clinical outcomes</text><text x="450.0" y="162.0" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="normal" font-style="normal">Laboratory values, such as</text><text x="450.0" y="180.0" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="normal" font-style="normal">a fall in HbA1c</text><text x="450.0" y="238.0" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="normal" font-style="normal">Lives saved,</text><text x="450.0" y="256.0" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="normal" font-style="normal">deaths prevented</text><text x="450.0" y="314.0" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="normal" font-style="normal">Days of disability</text><text x="450.0" y="332.0" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="normal" font-style="normal">avoided</text><line x1="360" y1="206" x2="540" y2="206" stroke="#2E7D5B" stroke-opacity="0.35"/><line x1="360" y1="282" x2="540" y2="282" stroke="#2E7D5B" stroke-opacity="0.35"/><rect x="610" y="70" width="260" height="300" rx="10" fill="#FBEDE9" stroke="#C8553D" stroke-width="2"/><rect x="610" y="70" width="260" height="56" rx="10" fill="#C8553D"/><rect x="610" y="110" width="260" height="16" fill="#C8553D"/><text x="740.0" y="106.0" font-size="17" text-anchor="middle" fill="#FFFFFF" font-weight="bold" font-style="normal">Humanistic outcomes</text><text x="740.0" y="162.0" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="normal" font-style="normal">Physical and</text><text x="740.0" y="180.0" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="normal" font-style="normal">social function</text><text x="740.0" y="238.0" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="normal" font-style="normal">Well-being and</text><text x="740.0" y="256.0" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="normal" font-style="normal">satisfaction</text><text x="740.0" y="314.0" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="normal" font-style="normal">Health-related</text><text x="740.0" y="332.0" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="normal" font-style="normal">quality of life</text><line x1="650" y1="206" x2="830" y2="206" stroke="#C8553D" stroke-opacity="0.35"/><line x1="650" y1="282" x2="830" y2="282" stroke="#C8553D" stroke-opacity="0.35"/><text x="450.0" y="40.0" font-size="17" text-anchor="middle" fill="#1F4E79" font-weight="bold" font-style="normal">The ECHO model: three kinds of outcome of a treatment or a test</text><text x="450.0" y="400.0" font-size="13" text-anchor="middle" fill="#5E6B78" font-weight="normal" font-style="italic">Humanistic outcomes can be combined with length of life as QALYs; count each economic benefit only once.</text></g></svg>