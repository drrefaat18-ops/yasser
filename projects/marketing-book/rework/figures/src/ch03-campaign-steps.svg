<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350"><rect width="900" height="350" fill="#FFFFFF"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5E6B78"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker></defs><g font-family="Segoe UI, Arial, Helvetica, sans-serif" fill="#1E2430"><rect x="33" y="90" width="124" height="76" rx="6" fill="#EEF3F9" stroke="#1F4E79" stroke-width="2"/><text x="95.0" y="123.9" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="bold" font-style="normal">1. Set the</text><text x="95.0" y="141.9" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="normal" font-style="normal">objective</text><line x1="159.0" y1="128.0" x2="171.0" y2="128.0" stroke="#1F4E79" stroke-width="2" marker-end="url(#b)"/><rect x="175" y="90" width="124" height="76" rx="6" fill="#EEF3F9" stroke="#1F4E79" stroke-width="2"/><text x="237.0" y="123.9" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="bold" font-style="normal">2. Define the</text><text x="237.0" y="141.9" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="normal" font-style="normal">audience</text><line x1="301.0" y1="128.0" x2="313.0" y2="128.0" stroke="#1F4E79" stroke-width="2" marker-end="url(#b)"/><rect x="317" y="90" width="124" height="76" rx="6" fill="#EEF3F9" stroke="#1F4E79" stroke-width="2"/><text x="379.0" y="123.9" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="bold" font-style="normal">3. Write the</text><text x="379.0" y="141.9" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="normal" font-style="normal">message</text><line x1="443.0" y1="128.0" x2="455.0" y2="128.0" stroke="#1F4E79" stroke-width="2" marker-end="url(#b)"/><rect x="459" y="90" width="124" height="76" rx="6" fill="#EEF3F9" stroke="#1F4E79" stroke-width="2"/><text x="521.0" y="123.9" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="bold" font-style="normal">4. Choose the</text><text x="521.0" y="141.9" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="normal" font-style="normal">channels</text><line x1="585.0" y1="128.0" x2="597.0" y2="128.0" stroke="#1F4E79" stroke-width="2" marker-end="url(#b)"/><rect x="601" y="90" width="124" height="76" rx="6" fill="#EEF3F9" stroke="#1F4E79" stroke-width="2"/><text x="663.0" y="123.9" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="bold" font-style="normal">5. Set the</text><text x="663.0" y="141.9" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="normal" font-style="normal">budget</text><line x1="727.0" y1="128.0" x2="739.0" y2="128.0" stroke="#1F4E79" stroke-width="2" marker-end="url(#b)"/><rect x="743" y="90" width="124" height="76" rx="6" fill="#FBEDE9" stroke="#C8553D" stroke-width="2"/><text x="805.0" y="123.9" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="bold" font-style="normal">6. Measure</text><text x="805.0" y="141.9" font-size="14" text-anchor="middle" fill="#1E2430" font-weight="normal" font-style="normal">and review</text><path d="M805,168 C805,260 95,260 95,172" fill="none" stroke="#C8553D" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="450.0" y="272.0" font-size="14" text-anchor="middle" fill="#C8553D" font-weight="normal" font-style="normal">Compare the results with the objective, then plan the next campaign</text><text x="450.0" y="50.0" font-size="17" text-anchor="middle" fill="#1F4E79" font-weight="bold" font-style="normal">Planning a digital campaign for a health service</text><text x="450.0" y="312.0" font-size="13" text-anchor="middle" fill="#5E6B78" font-weight="normal" font-style="normal">Useful indicators: appropriate bookings, cost per booking, patients arriving correctly prepared, complaints.</text><text x="450.0" y="329.0" font-size="13" text-anchor="middle" fill="#5E6B78" font-weight="normal" font-style="normal">Clicks and followers show only that people saw something.</text></g></svg>