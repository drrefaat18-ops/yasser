<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 455" width="900" height="455"><rect width="900" height="455" fill="#FFFFFF"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5C6B6A"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0E5E5B"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D0802A"/></marker></defs><g font-family="Segoe UI, Arial, Helvetica, sans-serif" fill="#1C2526"><rect x="60" y="40" width="780" height="300" fill="#FFFFFF" stroke="#0E5E5B" stroke-width="2"/><line x1="60" y1="40" x2="840" y2="340" stroke="#0E5E5B" stroke-width="1.5"/><line x1="840" y1="40" x2="60" y2="340" stroke="#0E5E5B" stroke-width="1.5"/><circle cx="450" cy="190" r="56" fill="#0E5E5B"/><text x="450.0" y="184.0" font-size="14" text-anchor="middle" fill="#FFFFFF" font-weight="bold" font-style="normal">Hagga Samira,</text><text x="450.0" y="202.0" font-size="14" text-anchor="middle" fill="#FFFFFF" font-weight="bold" font-style="normal">72</text><text x="450.0" y="70.0" font-size="14" text-anchor="middle" fill="#0E5E5B" font-weight="bold" font-style="normal">SAYS</text><text x="450.0" y="90.0" font-size="13" text-anchor="middle" fill="#1C2526" font-weight="normal" font-style="normal">"It is no trouble."</text><text x="450.0" y="107.0" font-size="13" text-anchor="middle" fill="#1C2526" font-weight="normal" font-style="normal">"I do not want to bother my son."</text><text x="720.0" y="175.0" font-size="14" text-anchor="middle" fill="#0E5E5B" font-weight="bold" font-style="normal">THINKS</text><text x="720.0" y="195.0" font-size="13" text-anchor="middle" fill="#1C2526" font-weight="normal" font-style="normal">Will I faint if I</text><text x="720.0" y="212.0" font-size="13" text-anchor="middle" fill="#1C2526" font-weight="normal" font-style="normal">fast too long?</text><text x="450.0" y="280.0" font-size="14" text-anchor="middle" fill="#0E5E5B" font-weight="bold" font-style="normal">DOES</text><text x="450.0" y="300.0" font-size="13" text-anchor="middle" fill="#1C2526" font-weight="normal" font-style="normal">Misses one test in three</text><text x="450.0" y="317.0" font-size="13" text-anchor="middle" fill="#1C2526" font-weight="normal" font-style="normal">Asks a neighbour to drive</text><text x="180.0" y="175.0" font-size="14" text-anchor="middle" fill="#0E5E5B" font-weight="bold" font-style="normal">FEELS</text><text x="180.0" y="195.0" font-size="13" text-anchor="middle" fill="#1C2526" font-weight="normal" font-style="normal">Embarrassed to ask</text><text x="180.0" y="212.0" font-size="13" text-anchor="middle" fill="#1C2526" font-weight="normal" font-style="normal">for help; anxious</text><rect x="60" y="360" width="380" height="80" rx="6" fill="#FBF1E4" stroke="#D0802A" stroke-width="2"/><text x="250.0" y="396.1" font-size="13" text-anchor="middle" fill="#1C2526" font-weight="bold" font-style="normal">PAINS</text><text x="250.0" y="413.1" font-size="13" text-anchor="middle" fill="#1C2526" font-weight="normal" font-style="normal">Stairs, transport, waiting, forgetting to fast</text><rect x="460" y="360" width="380" height="80" rx="6" fill="#EAF4F3" stroke="#0E5E5B" stroke-width="2"/><text x="650.0" y="396.1" font-size="13" text-anchor="middle" fill="#1C2526" font-weight="bold" font-style="normal">GAINS</text><text x="650.0" y="413.1" font-size="13" text-anchor="middle" fill="#1C2526" font-weight="normal" font-style="normal">Independence, tests on time, results explained</text></g></svg>