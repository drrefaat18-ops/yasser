A" stroke-width="2"/><text x="300.0" y="65.2" font-size="12" text-anchor="middle" fill="#1C2526" font-weight="bold" font-style="normal">Grants and</text><text x="300.0" y="81.2" font-size="12" text-anchor="middle" fill="#1C2526" font-weight="normal" font-style="normal">competitions</text><line x1="300" y1="100" x2="300" y2="300" stroke="#C9D3D3" stroke-dasharray="3 4"/><rect x="382" y="40" width="136" height="58" rx="6" fill="#EAF4F3" stroke="#0E5E5B" stroke-width="2"/><text x="450.0" y="65.2" font-size="12" text-anchor="middle" fill="#1C2526" font-weight="bold" font-style="normal">Angels and</text><text x="450.0" y="81.2" font-size="12" text-anchor="middle" fill="#1C2526" font-weight="normal" font-style="normal">seed rounds</text><line x1="450" y1="100" x2="450" y2="300" stroke="#C9D3D3" stroke-dasharray="3 4"/><rect x="532" y="40" width="136" height="58" rx="6" fill="#EAF4F3" stroke="#0E5E5B" stroke-width="2"/><text x="600.0" y="65.2" font-size="12" text-anchor="middle" fill="#1C2526" font-weight="bold" font-style="normal">Venture capital</text><text x="600.0" y="81.2" font-size="12" text-anchor="middle" fill="#1C2526" font-weight="normal" font-style="normal">Series A, B, ...</text><line x1="600" y1="100" x2="600" y2="300" stroke="#C9D3D3" stroke-dasharray="3 4"/><rect x="682" y="40" width="136" height="58" rx="6" fill="#EAF4F3" stroke="#0E5E5B" stroke-width="2"/><text x="750.0" y="65.2" font-size="12" text-anchor="middle" fill="#1C2526" font-weight="bold" font-style="normal">Private equity,</text><text x="750.0" y="81.2" font-size="12" text-anchor="middle" fill="#1C2526" font-weight="normal" font-style="normal">loans, listing</text><line x1="750" y1="100" x2="750" y2="300" stroke="#C9D3D3" stroke-dasharray="3 4"/></g></svg>