<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 495" width="900" height="495"><rect width="900" height="495" fill="#FFFFFF"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5C6B6A"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0E5E5B"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D0802A"/></marker></defs><g font-family="Segoe UI, Arial, Helvetica, sans-serif" fill="#1C2526"><path d="M40.0,40 L860.0,40 L810.0,118 L90.0,118 z" fill="#FBF1E4" stroke="#D0802A" stroke-width="2"/><text x="450.0" y="72.0" font-size="15" text-anchor="middle" fill="#D0802A" font-weight="bold" font-style="normal">A broad problem</text><text x="450.0" y="94.0" font-size="13" text-anchor="middle" fill="#1C2526" font-weight="normal" font-style="normal">Elderly patients miss blood tests</text><path d="M90.0,132 L810.0,132 L760.0,210 L140.0,210 z" fill="#EAF4F3" stroke="#0E5E5B" stroke-width="2"/><text x="450.0" y="164.0" font-size="15" text-anchor="middle" fill="#0E5E5B" font-weight="bold" font-style="normal">Problem</text><text x="450.0" y="186.0" font-size="13" text-anchor="middle" fill="#1C2526" font-weight="normal" font-style="normal">Fasting samples are not obtained on time</text><path d="M140.0,224 L760.0,224 L710.0,302 L190.0,302 z" fill="#FBF1E4" stroke="#D0802A" stroke-width="2"/><text x="450.0" y="256.0" font-size="15" text-anchor="middle" fill="#D0802A" font-weight="bold" font-style="normal">Population</text><text x="450.0" y="278.0" font-size="13" text-anchor="middle" fill="#1C2526" font-weight="normal" font-style="normal">Elderly outpatients with limited mobility</text><path d="M190.0,316 L710.0,316 L660.0,394 L240.0,394 z" fill="#EAF4F3" stroke="#0E5E5B" stroke-width="2"/><text x="450.0" y="348.0" font-size="15" text-anchor="middle" fill="#0E5E5B" font-weight="bold" font-style="normal">Outcome</text><text x="450.0" y="370.0" font-size="13" text-anchor="middle" fill="#1C2526" font-weight="normal" font-style="normal">At least 90% of scheduled tests completed on time</text><rect x="205" y="420" width="490" height="60" rx="6" fill="#0E5E5B" stroke="#0E5E5B" stroke-width="2"/><text x="450.0" y="438.2" font-size="12" text-anchor="middle" fill="#FFFFFF" font-weight="bold" font-style="normal">Need statement (no solution named)</text><text x="450.0" y="454.2" font-size="12" text-anchor="middle" fill="#FFFFFF" font-weight="normal" font-style="normal">A way to obtain fasting samples from elderly outpatients with limited</text><text x="450.0" y="470.2" font-size="12" text-anchor="middle" fill="#FFFFFF" font-weight="normal" font-style="normal">mobility, so that at least 90% of scheduled tests are completed on time</text></g></svg>