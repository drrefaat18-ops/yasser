<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 512" width="900" height="512"><rect width="900" height="512" fill="#FFFFFF"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5C6B6A"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0E5E5B"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D0802A"/></marker></defs><g font-family="Segoe UI, Arial, Helvetica, sans-serif" fill="#1C2526"><text x="450.0" y="34.0" font-size="17" text-anchor="middle" fill="#0E5E5B" font-weight="bold" font-style="normal">Hofstede's six dimensions: what a low and a high score mean</text><text x="250.0" y="64.0" font-size="12" text-anchor="middle" fill="#5C6B6A" font-weight="bold" font-style="normal">LOW SCORE</text><text x="650.0" y="64.0" font-size="12" text-anchor="middle" fill="#5C6B6A" font-weight="bold" font-style="normal">HIGH SCORE</text><text x="450.0" y="100.0" font-size="15" text-anchor="middle" fill="#1C2526" font-weight="bold" font-style="normal">Power distance</text><line x1="120" y1="118" x2="772" y2="118" stroke="#0E5E5B" stroke-width="4"/><path d="M772,111 L786,118 L772,125 z" fill="#0E5E5B"/><text x="120.0" y="140.0" font-size="13" text-anchor="start" fill="#5C6B6A" font-weight="normal" font-style="normal">Power spread more equally</text><text x="780.0" y="140.0" font-size="13" text-anchor="end" fill="#5C6B6A" font-weight="normal" font-style="normal">Unequal power accepted</text><text x="450.0" y="164.0" font-size="15" text-anchor="middle" fill="#1C2526" font-weight="bold" font-style="normal">Individualism vs collectivism</text><line x1="120" y1="182" x2="772" y2="182" stroke="#0E5E5B" stroke-width="4"/><path d="M772,175 L786,182 L772,189 z" fill="#0E5E5B"/><text x="120.0" y="204.0" font-size="13" text-anchor="start" fill="#5C6B6A" font-weight="normal" font-style="normal">Strong, loyal groups</text><text x="780.0" y="204.0" font-size="13" text-anchor="end" fill="#5C6B6A" font-weight="normal" font-style="normal">Look after oneself</text><text x="450.0" y="228.0" font-size="15" text-anchor="middle" fill="#1C2526" font-weight="bold" font-style="normal">Masculinity vs femininity</text><line x1="120" y1="246" x2="772" y2="246" stroke="#0E5E5B" stroke-width="4"/><path d="M772,239 L786,246 L772,253 z" fill="#0E5E5B"/><text x="120.0" y="268.0" font-size="13" text-anchor="start" fill="#5C6B6A" font-weight="normal" font-style="normal">Cooperation, caring</text><text x="780.0" y="268.0" font-size="13" text-anchor="end" fill="#5C6B6A" font-weight="normal" font-style="normal">Competition, achievement</text><text x="450.0" y="292.0" font-size="15" text-anchor="middle" fill="#1C2526" font-weight="bold" font-style="normal">Uncertainty avoidance</text><line x1="120" y1="310" x2="772" y2="310" stroke="#D0802A" stroke-width="4"/><path d="M772,303 L786,310 L772,317 z" fill="#D0802A"/><text x="120.0" y="332.0" font-size="13" text-anchor="start" fill="#5C6B6A" font-weight="normal" font-style="normal">Comfortable with ambiguity</text><text x="780.0" y="332.0" font-size="13" text-anchor="end" fill="#5C6B6A" font-weight="normal" font-style="normal">Threatened by ambiguity</text><text x="450.0" y="356.0" font-size="15" text-anchor="middle" fill="#1C2526" font-weight="bold" font-style="normal">Long- vs short-term orientation</text><line x1="120" y1="374" x2="772" y2="374" stroke="#0E5E5B" stroke-width="4"/><path d="M772,367 L786,374 L772,381 z" fill="#0E5E5B"/><text x="120.0" y="396.0" font-size="13" text-anchor="start" fill="#5C6B6A" font-weight="normal" font-style="normal">Tradition, quick results</text><text x="780.0" y="396.0" font-size="13" text-anchor="end" fill="#5C6B6A" font-weight="normal" font-style="normal">Persistence, the future</text><text x="450.0" y="420.0" font-size="15" text-anchor="middle" fill="#1C2526" font-weight="bold" font-style="normal">Indulgence vs restraint</text><line x1="120" y1="438" x2="772" y2="438" stroke="#0E5E5B" stroke-width="4"/><path d="M772,431 L786,438 L772,445 z" fill="#0E5E5B"/><text x="120.0" y="460.0" font-size="13" text-anchor="start" fill="#5C6B6A" font-weight="normal" font-style="normal">Strict control of desires</text><text x="780.0" y="460.0" font-size="13" text-anchor="end" fill="#5C6B6A" font-weight="normal" font-style="normal">Free gratification</text><text x="450.0" y="498.0" font-size="13" text-anchor="middle" fill="#5C6B6A" font-weight="normal" font-style="italic">Scores describe national averages, not individuals.</text></g></svg>