<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="440" fill="#FFFFFF"/>
  <defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1A1F36"/></marker></defs>
  <text x="450" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#1B2A8C">Serotonin and noradrenaline synapse: antidepressant targets</text>
  <path d="M250,50 h400 v150 q-200,60 -400,0 z" fill="#EAF0FB" stroke="#1B2A8C" stroke-width="2"/>
  <text x="450" y="75" font-size="15" text-anchor="middle" fill="#1A1F36">Presynaptic neuron</text>
  <circle cx="410" cy="130" r="15" fill="#FFFFFF" stroke="#1B2A8C" stroke-width="2"/><text x="410" y="134" font-size="10" text-anchor="middle">5-HT</text>
  <circle cx="455" cy="145" r="15" fill="#FFFFFF" stroke="#1B2A8C" stroke-width="2"/><text x="455" y="149" font-size="10" text-anchor="middle">NA</text>
  <circle cx="500" cy="130" r="15" fill="#FFFFFF" stroke="#1B2A8C" stroke-width="2"/><text x="500" y="134" font-size="10" text-anchor="middle">5-HT</text>
  <rect x="290" y="95" width="70" height="32" rx="6" fill="#FDF4DC" stroke="#8A6100" stroke-width="2"/>
  <text x="325" y="116" font-size="14" text-anchor="middle" font-weight="bold" fill="#8A6100">MAO</text>
  <rect x="40" y="95" width="190" height="32" rx="6" fill="#E8F3E9" stroke="#2E7D32" stroke-width="2"/>
  <text x="135" y="116" font-size="13" text-anchor="middle" font-weight="bold" fill="#2E7D32">MAO inhibitors</text>
  <line x1="230" y1="111" x2="288" y2="111" stroke="#B3261E" stroke-width="3"/>
  <rect x="590" y="168" width="60" height="28" rx="6" fill="#FFFFFF" stroke="#1B2A8C" stroke-width="2"/>
  <text x="620" y="187" font-size="13" text-anchor="middle" font-weight="bold" fill="#1B2A8C">α2</text>
  <rect x="690" y="115" width="190" height="50" rx="6" fill="#E8F3E9" stroke="#2E7D32" stroke-width="2"/>
  <text x="785" y="136" font-size="13" text-anchor="middle" font-weight="bold" fill="#2E7D32">Mirtazapine</text>
  <text x="785" y="154" font-size="11" text-anchor="middle" fill="#2E7D32">blocks the α2 brake</text>
  <line x1="690" y1="160" x2="652" y2="178" stroke="#B3261E" stroke-width="3"/>
  <rect x="265" y="176" width="84" height="28" rx="6" fill="#FFFFFF" stroke="#1B2A8C" stroke-width="2"/>
  <text x="307" y="195" font-size="12" text-anchor="middle" font-weight="bold" fill="#1B2A8C">SERT / NET</text>
  <rect x="20" y="168" width="210" height="50" rx="6" fill="#E8F3E9" stroke="#2E7D32" stroke-width="2"/>
  <text x="125" y="189" font-size="13" text-anchor="middle" font-weight="bold" fill="#2E7D32">SSRIs, SNRIs, TCAs</text>
  <text x="125" y="207" font-size="11" text-anchor="middle" fill="#2E7D32">block reuptake</text>
  <line x1="230" y1="192" x2="263" y2="191" stroke="#B3261E" stroke-width="3"/>
  <line x1="455" y1="222" x2="455" y2="296" stroke="#1A1F36" stroke-width="2" marker-end="url(#ar)"/>
  <text x="467" y="262" font-size="13" fill="#1A1F36">release</text>
  <path d="M390,280 q-50,-30 -75,-72" fill="none" stroke="#1A1F36" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#ar)"/>
  <text x="330" y="262" font-size="12" text-anchor="end" fill="#1A1F36">reuptake</text>
  <path d="M520,275 q70,-25 98,-75" fill="none" stroke="#1A1F36" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#ar)"/>
  <text x="590" y="270" font-size="12" fill="#1A1F36">feedback</text>
  <path d="M250,420 h400 v-90 q-200,-45 -400,0 z" fill="#F1F3F5" stroke="#5A6072" stroke-width="2"/>
  <rect x="375" y="306" width="60" height="20" fill="#1B2A8C"/><rect x="475" y="306" width="60" height="20" fill="#1B2A8C"/>
  <text x="450" y="370" font-size="14" text-anchor="middle" fill="#1A1F36">Postsynaptic neuron</text>
  <text x="450" y="390" font-size="12" text-anchor="middle" fill="#1A1F36">5-HT and adrenergic receptors</text>
  <text x="785" y="320" font-size="13" font-weight="bold" text-anchor="middle" fill="#1A1F36">Receptor side effects</text>
  <text x="785" y="342" font-size="12" text-anchor="middle" fill="#1A1F36">α1 block → hypotension</text>
  <text x="785" y="362" font-size="12" text-anchor="middle" fill="#1A1F36">H1 block → sedation, weight gain</text>
  <text x="785" y="382" font-size="12" text-anchor="middle" fill="#1A1F36">M block → dry mouth, retention</text>
  <text x="125" y="340" font-size="12" text-anchor="middle" fill="#B3261E">red bar = blocked by the drug</text>
</svg>
