<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="440" fill="#FAF8F1"/>
  <text x="450" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#1B2A8C">Balanced anaesthesia: five goals, several drugs</text>
  <g stroke="#5A6072" stroke-width="2">
    <line x1="450" y1="225" x2="160" y2="110"/><line x1="450" y1="225" x2="740" y2="110"/>
    <line x1="450" y1="225" x2="130" y2="330"/><line x1="450" y1="225" x2="770" y2="330"/>
    <line x1="450" y1="225" x2="450" y2="370"/>
  </g>
  <ellipse cx="450" cy="225" rx="130" ry="50" fill="#1B2A8C"/>
  <text x="450" y="221" font-size="17" font-weight="bold" text-anchor="middle" fill="#FFFFFF">General</text>
  <text x="450" y="243" font-size="17" font-weight="bold" text-anchor="middle" fill="#FFFFFF">anaesthesia</text>
  <g font-size="13" text-anchor="middle" fill="#1A1F36">
    <rect x="30" y="60" width="260" height="80" rx="10" fill="#EAF0FB" stroke="#1B2A8C" stroke-width="2"/>
    <text x="160" y="88" font-size="15" font-weight="bold" fill="#1B2A8C">1. Unconsciousness</text>
    <text x="160" y="110">Propofol, thiopental, etomidate</text>
    <text x="160" y="128">Volatile agents</text>
    <rect x="610" y="60" width="260" height="80" rx="10" fill="#EAF0FB" stroke="#1B2A8C" stroke-width="2"/>
    <text x="740" y="88" font-size="15" font-weight="bold" fill="#1B2A8C">2. Amnesia</text>
    <text x="740" y="110">Midazolam</text>
    <text x="740" y="128">Volatile agents, propofol</text>
    <rect x="10" y="290" width="240" height="80" rx="10" fill="#E8F3E9" stroke="#2E7D32" stroke-width="2"/>
    <text x="130" y="318" font-size="15" font-weight="bold" fill="#2E7D32">3. Analgesia</text>
    <text x="130" y="340">Opioids (fentanyl), ketamine</text>
    <text x="130" y="358">Nitrous oxide</text>
    <rect x="650" y="290" width="240" height="80" rx="10" fill="#FDF4DC" stroke="#8A6100" stroke-width="2"/>
    <text x="770" y="318" font-size="15" font-weight="bold" fill="#8A6100">4. Muscle relaxation</text>
    <text x="770" y="340">Rocuronium, atracurium</text>
    <text x="770" y="358">Succinylcholine</text>
    <rect x="320" y="340" width="260" height="80" rx="10" fill="#FBEAEA" stroke="#B3261E" stroke-width="2"/>
    <text x="450" y="368" font-size="15" font-weight="bold" fill="#B3261E">5. Loss of autonomic reflexes</text>
    <text x="450" y="390">Opioids, adequate anaesthetic depth</text>
    <text x="450" y="408">β-blockers if needed</text>
  </g>
</svg>
