<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="900" height="370" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="370" fill="#FBF7F2"/>
  <defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2B211C"/></marker></defs>
  <text x="450" y="32" font-size="20" font-weight="bold" text-anchor="middle" fill="#A4472B">The seven-step approach to a drug information request</text>
  <rect x="40" y="70" width="180" height="90" rx="12" fill="#F6E5DE" stroke="#A4472B" stroke-width="2.5"/>
  <circle cx="66" cy="96" r="16" fill="#A4472B"/><text x="66" y="102" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">1</text>
  <text x="140" y="110" font-size="16" font-weight="bold" text-anchor="middle" fill="#2B211C">Requester</text>
  <text x="130" y="138" font-size="13" text-anchor="middle" fill="#6E625B">who, how urgent</text>
  <line x1="222" y1="115" x2="252" y2="115" stroke="#2B211C" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="255" y="70" width="180" height="90" rx="12" fill="#F6E5DE" stroke="#A4472B" stroke-width="2.5"/>
  <circle cx="281" cy="96" r="16" fill="#A4472B"/><text x="281" y="102" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">2</text>
  <text x="355" y="110" font-size="16" font-weight="bold" text-anchor="middle" fill="#2B211C">Background</text>
  <text x="345" y="138" font-size="13" text-anchor="middle" fill="#6E625B">patient and drugs</text>
  <line x1="437" y1="115" x2="467" y2="115" stroke="#2B211C" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="470" y="70" width="180" height="90" rx="12" fill="#E0EEF0" stroke="#2F6F7A" stroke-width="2.5"/>
  <circle cx="496" cy="96" r="16" fill="#2F6F7A"/><text x="496" y="102" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">3</text>
  <text x="570" y="110" font-size="16" font-weight="bold" text-anchor="middle" fill="#2B211C">Real question</text>
  <text x="560" y="138" font-size="13" text-anchor="middle" fill="#6E625B">the true need</text>
  <line x1="652" y1="115" x2="682" y2="115" stroke="#2B211C" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="685" y="70" width="180" height="90" rx="12" fill="#F6E5DE" stroke="#A4472B" stroke-width="2.5"/>
  <circle cx="711" cy="96" r="16" fill="#A4472B"/><text x="711" y="102" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">4</text>
  <text x="785" y="110" font-size="16" font-weight="bold" text-anchor="middle" fill="#2B211C">Classify</text>
  <text x="775" y="138" font-size="13" text-anchor="middle" fill="#6E625B">type of question</text>
  <rect x="147" y="220" width="180" height="90" rx="12" fill="#F6E5DE" stroke="#A4472B" stroke-width="2.5"/>
  <circle cx="173" cy="246" r="16" fill="#A4472B"/><text x="173" y="252" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">5</text>
  <text x="247" y="260" font-size="16" font-weight="bold" text-anchor="middle" fill="#2B211C">Search</text>
  <text x="237" y="288" font-size="13" text-anchor="middle" fill="#6E625B">tertiary first</text>
  <line x1="329" y1="265" x2="359" y2="265" stroke="#2B211C" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="362" y="220" width="180" height="90" rx="12" fill="#F6E5DE" stroke="#A4472B" stroke-width="2.5"/>
  <circle cx="388" cy="246" r="16" fill="#A4472B"/><text x="388" y="252" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">6</text>
  <text x="462" y="260" font-size="16" font-weight="bold" text-anchor="middle" fill="#2B211C">Answer</text>
  <text x="452" y="288" font-size="13" text-anchor="middle" fill="#6E625B">clear, referenced</text>
  <line x1="544" y1="265" x2="574" y2="265" stroke="#2B211C" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="577" y="220" width="180" height="90" rx="12" fill="#F6E5DE" stroke="#A4472B" stroke-width="2.5"/>
  <circle cx="603" cy="246" r="16" fill="#A4472B"/><text x="603" y="252" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">7</text>
  <text x="677" y="260" font-size="16" font-weight="bold" text-anchor="middle" fill="#2B211C">Follow up</text>
  <text x="667" y="288" font-size="13" text-anchor="middle" fill="#6E625B">and document</text>
  <path d="M 815 160 L 815 185 L 237 185 L 237 216" fill="none" stroke="#2B211C" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="450" y="345" font-size="13" text-anchor="middle" fill="#2F6F7A" font-weight="bold">Step 3 is the one most often skipped</text>
</svg>
